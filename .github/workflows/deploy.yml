name: Deploy to Firebase Hosting

# Runs whenever main changes (so merging a pull request publishes the site),
# and can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check every lesson is solvable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install — the test suite is plain Node.
      - run: npm test

  deploy:
    name: Publish to compactit.web.app
    needs: test          # a broken lesson never reaches the live site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # compactit.web.app serves the app; akylduukodo.web.app (the old address)
      # forwards there. The new site is created the first time this runs.
      - name: Create compactit.web.app (once) and publish both sites
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKYLDUUKODO }}
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm i -g firebase-tools@14 >/dev/null
          firebase hosting:sites:get compactit --project akylduukodo >/dev/null 2>&1 \
            || firebase hosting:sites:create compactit --project akylduukodo --non-interactive
          npm i --no-save google-auth-library@9 >/dev/null
          node scripts/auth-domains.mjs akylduukodo
          firebase deploy --only hosting --project akylduukodo --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
