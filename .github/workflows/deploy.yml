name: Deploy to Firebase Hosting

# Runs whenever main changes, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check every question is answerable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install — the test suite is plain Node.
      - run: npm test

  deploy:
    name: Publish to malikastudy.web.app
    needs: test          # a broken question never reaches a child
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKYLDUUKODO }}
          channelId: live
          projectId: akylduukodo
          target: malikastudy
