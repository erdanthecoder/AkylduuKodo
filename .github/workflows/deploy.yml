name: Deploy to Firebase Hosting

# Runs whenever main changes, and can be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check every question is answerable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install — the test suite is plain Node.
      - run: npm test

  deploy:
    name: Publish to malikastudy.web.app
    needs: test          # a broken question never reaches a child
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKYLDUUKODO }}
          channelId: live
          projectId: akylduukodo
          # Pinned on purpose. From firebase-tools v13 the CLI checks whether
          # the Hosting API is enabled before deploying, which needs
          # serviceusage.services.get — a permission this service account does
          # not hold, so the deploy 403s before uploading anything. The action
          # installs the newest CLI by default, which is why this project
          # deployed fine for months and then stopped on its own.
          #
          # The durable fix is to grant the service account
          # roles/serviceusage.serviceUsageConsumer in Google Cloud IAM. Until
          # that is done, an older CLI skips the check and deploys.
          firebaseToolsVersion: "12.9.1"
