name: Publish security rules

# Uploads the Firestore and Realtime Database rules, each on its own, so one
# missing permission does not hold up the other. Runs when the rules change.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['rules/**', '.github/workflows/rules.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Publish rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: akylduukodo
      FIREBASE: npx -y firebase-tools@12.9.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sign in with the service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKYLDUUKODO }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "Signed in as: $(jq -r .client_email "$RUNNER_TEMP/sa.json")"
      - name: Realtime Database rules
        id: rtdb
        continue-on-error: true
        run: $FIREBASE deploy --only database --project "$PROJECT" --non-interactive
      - name: Firestore rules
        id: fs
        continue-on-error: true
        run: $FIREBASE deploy --only firestore:rules --project "$PROJECT" --non-interactive --debug 2>&1 | tail -40
      - name: Firestore rules (direct, without the test step)
        id: fs2
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock firebase-admin@12.7.0 >/dev/null 2>&1
          node -e "
            const admin = require('firebase-admin');
            const fs = require('fs');
            admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: process.env.PROJECT });
            admin.securityRules().releaseFirestoreRulesetFromSource(fs.readFileSync('rules/firestore.rules', 'utf8'))
              .then((r) => { console.log('Firestore rules released:', r.name); process.exit(0); })
              .catch((e) => { console.error('Firestore rules failed:', e.code, e.message); process.exit(1); });
          "
      - name: Result
        run: |
          echo "Realtime Database rules: ${{ steps.rtdb.outcome }}"
          echo "Firestore rules: ${{ steps.fs.outcome }} / direct: ${{ steps.fs2.outcome }}"
          echo "### Realtime Database rules: ${{ steps.rtdb.outcome }} · Firestore rules: ${{ steps.fs.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
